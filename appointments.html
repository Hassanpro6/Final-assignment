<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Appointments - PatientCare</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<h2>Book Appointment</h2>
<button id="logoutBtn">Logout</button>

<form id="appointmentForm">
  <input type="text" id="patientName" placeholder="Patient Name" required>
  <select id="doctor" required>
    <option value="">Select Doctor</option>
    <option>Dr. Smith</option>
    <option>Dr. Jane</option>
  </select>
  <input type="date" id="date" required>
  <input type="time" id="time" required>
  <textarea id="reason" placeholder="Reason for visit" required></textarea>
  <button type="submit">Book Appointment</button>
</form>

<h2>My Appointments</h2>
<div id="appointmentsList"></div>

<script type="module">
 // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-analytics.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional

    apiKey: "AIzaSyCHtQvPolc5VsG7ap7hMaFl9bjoIIhxo5c",
    authDomain: "final-assignment-6ce52.firebaseapp.com",
    projectId: "final-assignment-6ce52",
    storageBucket: "final-assignment-6ce52.firebasestorage.app",
    messagingSenderId: "1097490759574",
    appId: "1:1097490759574:web:c880f5be7d261dee8a27b7",
    measurementId: "G-VH855LMH65"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);

// Logout button
document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
  alert("Logged out!");
  window.location.href = "login.html";
});

// Protect page and fetch appointments
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    alert("Please login first");
    window.location.href = "login.html";
  } else {
    loadAppointments(user.uid);
  }
});

// Book appointment
document.getElementById("appointmentForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const user = auth.currentUser;
  if (!user) return;

  await addDoc(collection(db, "appointments"), {
    patientName: document.getElementById("patientName").value,
    doctor: document.getElementById("doctor").value,
    date: document.getElementById("date").value,
    time: document.getElementById("time").value,
    reason: document.getElementById("reason").value,
    userId: user.uid,
    status: "Pending"
  });

  alert("Appointment booked!");
  document.getElementById("appointmentForm").reset();
  loadAppointments(user.uid);
});

// Load appointments of current user
async function loadAppointments(uid) {
  const q = query(collection(db, "appointments"), where("userId", "==", uid));
  const snapshot = await getDocs(q);
  const listDiv = document.getElementById("appointmentsList");
  listDiv.innerHTML = "";

  snapshot.forEach(doc => {
    const data = doc.data();
    const div = document.createElement("div");
    div.classList.add("appointment-card");
    div.innerHTML = `
      <strong>Doctor:</strong> ${data.doctor} <br>
      <strong>Date:</strong> ${data.date} <br>
      <strong>Time:</strong> ${data.time} <br>
      <strong>Status:</strong> ${data.status} <br>
      <strong>Reason:</strong> ${data.reason} <hr>
    `;
    listDiv.appendChild(div);
  });
}
</script>
</body>
</html>
